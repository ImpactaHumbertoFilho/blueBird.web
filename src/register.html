<!DOCTYPE html>
<html>
    <head>
        <title>Sobre nós - BlueBird Airlines</title>
        <link rel="stylesheet" type="text/css" href="./css/padrao.css">
        <link rel="stylesheet" type="text/css" href="./css/header.css">
        <link rel="stylesheet" type="text/css" href="./css/register.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
            rel="stylesheet">
    </head>
    <body>
        <header>
            <div class="wrapper navbar">
                <figure>
                    <img src="./img/logo.png" alt="Logo" title="Logo">
                    <a href="index.html" title="home" alt="home">BLUEBIRD</a>
                </figure>
                <nav>
                    <a href="register.html">Cadastro</a>
                    <a href="login.html">Login</a>
                </nav>
            </div>
        </header>
        <section class="background">
                <div class="forms-caixa">
                    <h2>CADASTRE-SE</h2>
                    <form id="registerForm" onsubmit="Register(event)">
                        <label for="name">Nome:</label>
                        <input type="text" id="name" name="name" required/>
            
                        <label for="birthday">Data de Nascimento:</label>
                        <input type="date" id="birthday" name="birthday" class="birthday" required/>
            
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required/>
        
                        <label for="cpf_cnpj">CPF:</label>
                        <input type="text" id="cpf_cnpj" name="cpf_cnpj" required/>

                        <label for="password">Senha:</label>
                        <input type="password" id="password" name="password" required/>
            
                        <label for="terms">Aceito os Termos:</label>
                        <input type="checkbox" id="terms" name="terms" required/>
            
                        <input class= "secundary-button" type="submit" value="Cadastrar"/>
                    </form>
            </div>
        </section>
    </body>
</html>

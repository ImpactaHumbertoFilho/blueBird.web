<!DOCTYPE html>
<html>
<head>
    <title>BlueBird Airlines</title>
    <link rel="stylesheet" type="text/css" href="css/styles.css">
</head>
<body>
    <header>
        <nav>
            <a class="logo" href="/index.html">BlueBird</a>
            <ul class="nav-list">
                <li><a href="/index.html">Home</a></li>
                <li><a href="">Sobre-nós</a></li>
            </ul>
            
            <div class="login-button">
                <button><a href="login.html">Login</a></button>
            </div>
        </nav>
    </header>
    <main>
        <section class="upper-section">
            <div class="container">
                <h2>Cadastre-se</h2>
                <form id="registerForm" onsubmit="Register(event)">
                    <label for="name">Nome:</label>
                    <input type="text" id="name" name="name" required/>
        
                    <label for="birthday">Data de Nascimento:</label>
                    <input type="date" id="birthday" name="birthday" required/>
        
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required/>
        
                    <label for="password">Senha:</label>
                    <input type="password" id="password" name="password" required/>
        
                    <label for="cpf_cnpj">CPF:</label>
                    <input type="text" id="cpf_cnpj" name="cpf_cnpj" required/>
        
                    <label for="terms">Aceito os Termos:</label>
                    <input type="checkbox" id="terms" name="terms" required/>
        
                    <input class= "secundary-button" type="submit" value="Cadastrar"/>
                </form>
            </div>
        <section/>
    </main>
</body>
</html>

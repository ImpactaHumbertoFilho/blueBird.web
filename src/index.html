<!DOCTYPE html>
<html>

<head>
    <title>BlueBird Airlines</title>
    <link rel="stylesheet" type="text/css" href="./App/componentes/main.css">
    <link rel="stylesheet" type="text/css" href="./App/componentes/header/header.css">
    <link rel="stylesheet" type="text/css" href="./App/componentes/primeira-secao/primeira-secao.css">
    <link rel="stylesheet" type="text/css" href="./App/componentes/voos-populares/voos-populares.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <div class="wrapper navbar">
            <figure>
                <img src="./img/logo.png" alt="Logo" title="Logo">
            </figure>
            <nav>
                <a href="./pages/register.html">Cadastro</a>
                <a href="./pages/login.html">Login</a>
            </nav>
        </div>
    </header>
    <section class="primeira-secao">
        <div class="banner-home">
            <div class="overlay"></div>
            <div class="banner-texto">
                <h1>BEM-VINDOS À <span><b>BLUEBIRD</b></span>!</h1>
                <p>Um te leva para marte, e nós te levamos<br>
                    para qualquer lugar!</p>
            </div>
            <a href="" title="Saiba mais" class="banner-botao">Saiba mais!</a>
        </div>
    </section>
    <section class="wrapper voos-populares">
        <div class="align-container">
            <div class="container-destino">
                <figure>
                    <img src="./img/encontre-seu-destino-flag.png" alt="Encontre seu destino"
                        title="Encontre seu destino">
                </figure>
            </div>
        </div>
        <div class="voos">
            <div class="paris-fernando-marrocos">
                <figure class="paris">
                    <img src="./img/componente-1.png" alt="">
                </figure>
                <div class="fernando-marrocos">
                    <figure class="fernando">
                        <img src="./img/componente-3.png" alt="">
                    </figure>
                    <figure class="marrocos">
                        <img src="./img/componente-4.png" alt="">
                    </figure>
                </div>
            </div>
            <div class="mexico">
                <figure class="mexico-img">
                    <img src="./img/componente-2.png" alt="">
                </figure>
            </div>
        </div>
    </section>
</body>

</html>
